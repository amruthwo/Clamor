name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "assets/**"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, so the main-only CUDA build runs even in quiet weeks

# A new push to a PR cancels the run it supersedes. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fail (not skip) the engine reference tests if numpy/gguf are missing.
  CLAMOR_REQUIRE_PY: "1"
  # Same for the tokenizer and chat-template tests, which compare against Hugging Face's
  # reference implementations (needs network access to huggingface.co).
  CLAMOR_REQUIRE_HF: "1"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, features: "" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, features: "" }
          - { name: macos-metal, os: macos-15, features: "metal" }
          - { name: windows-x86_64, os: windows-2022, features: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy gguf tokenizers jinja2 huggingface_hub
      - name: Test workspace
        shell: bash
        run: |
          F="${{ matrix.features }}"
          if [ -n "$F" ]; then cargo test --workspace --release --features "clamor-engine-ggml/$F"; else cargo test --workspace --release; fi
      - name: Report devices
        shell: bash
        run: |
          F="${{ matrix.features }}"
          if [ -n "$F" ]; then cargo run -q -p clamor-engine-ggml --release --features "$F" --example devices; else cargo run -q -p clamor-engine-ggml --release --example devices; fi

  vulkan-build:
    name: build (linux vulkan, build-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc spirv-headers
      # -vv streams the build script output, so the log shows CMake progress ("[ 45%] Building ...")
      # instead of sitting on the last "Compiling" line while ggml builds.
      - run: cargo build -vv -p clamor-engine-ggml --release --features vulkan

  android:
    name: build (android arm64, build-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r27c }
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build -p clamor-engine-ggml --release
        env: { ANDROID_NDK_HOME: "${{ steps.ndk.outputs.ndk-path }}" }

  cuda-build:
    name: build (linux cuda, build-only)
    # ggml-cuda is hundreds of heavy .cu files: ~1 h on a hosted runner from cold. Too slow to gate
    # every PR, so it runs on main, weekly, and on demand (Actions -> ci -> Run workflow).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-cache does not keep our own crate's CMake output, so cache compiler results instead.
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: cuda-build, max-size: 2G }
      - uses: Jimver/cuda-toolkit@v0.2.19
        with: { cuda: "12.6.2", method: network, sub-packages: '["nvcc","cudart"]', non-cuda-sub-packages: '["libcublas","libcublas-dev"]' }
      - run: cargo build -vv -p clamor-engine-ggml --release --features cuda  # -vv: live CMake progress
        # Build-only: one architecture proves it compiles (three took 50+ min on a hosted runner).
        env:
          CMAKE_CUDA_ARCHITECTURES: "86"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_CUDA_COMPILER_LAUNCHER: ccache
