[package]
name = "clamor-desktop"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Clamor desktop app: a window and tray icon around clamor-node"

# Not part of the main workspace: Tauri needs the system web view libraries to build, and the
# engine's tests must not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
