[package]
name = "clamor-desktop"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Clamor desktop app: a window and tray icon around clamor-node"

# Not part of the main workspace: Tauri needs the system web view libraries to build, and the
# engine's tests must not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# Tauri's mobile builds need a library; the desktop binary (src/main.rs) calls it too.
name = "clamor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop only: start at login, one window.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Android: clamor-node runs inside the app.
[target.'cfg(target_os = "android")'.dependencies]
clamor-node = { path = "../../crates/clamor-node" }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = "thin"
