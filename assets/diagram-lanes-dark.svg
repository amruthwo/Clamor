<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Two kinds of work</title><desc id="d">Left: one big model split across four machines that pass each word around a ring. Right: small jobs such as summarize, embed, transcribe, OCR and tool calls are sent to whichever device is free, including a phone.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7f6a"/></marker><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bba7a2"/></marker></defs><rect x="20" y="20" width="450" height="360" rx="20" fill="#211816" stroke="#5b3d35" stroke-width="1.5"/><text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f6ece9" text-anchor="start" >One big model</text><text x="48" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#bba7a2" text-anchor="start" >Too big for any single machine? Split it.</text><rect x="490" y="20" width="450" height="360" rx="20" fill="#211816" stroke="#5b3d35" stroke-width="1.5"/><text x="518" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f6ece9" text-anchor="start" >Lots of small jobs</text><text x="518" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#bba7a2" text-anchor="start" >Spread them out. Every device helps.</text><path d="M282.4,161.0 A92,92 0 0 1 327.7,204.7" stroke="#ff7f6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M329.0,282.