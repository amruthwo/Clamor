<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">One big model split across three machines</title><desc id="d">A 70-billion-parameter model of about 40 GB is cut into three layer ranges. A gaming PC runs layers 1 to 40, a laptop runs 41 to 68 and a mini PC runs 69 to 80. Each passes its result to the next, and the last sends the next word back to the first.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff7f6a"/></marker></defs><text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f6ece9" text-anchor="start" >One 70B model · 80 layers · about 40 GB</text><text x="920" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bba7a2" text-anchor="end" >too big for any one of these machines</text><path d="M50,48 H480.0 V88 H50 Q40,88 40,78 V58 Q40,48 50,48 Z" fill="#fd5453"/><text x="260.0" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" >layers 1–40</text><path d="M480.0,48 H788.0 V88 H480.0 Z" fill="#fc7a5c"/><text x="634.0" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" >layers 41–68</text><path d="M788.0,48 H910.0 Q920.0,48 920.0,58 V78 Q920.0,88 910.0,88 H788.0 Z" fill="#fca07c"/><text x="854.0" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5a2318" text-anchor="middle" >layers 69–80</text><path d="M260.0,92 C260.0,128 158.0,130 158.0,164" stroke="#fd5453" stroke-width="2" stroke-dasharray="4 5" fill="none"/><rect x="40.0" y="170" width="236" height="150" rx="16" fill="#2a1f1d" stroke="#5b3d35" stroke-width="1.5"/><g transform="translate(138.0,192)"><rect x="0" y="0" width="40" height="26" rx="3" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 26v5M12 31h16" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="158.0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f6ece9" text-anchor="middle" >Gaming PC</text><text x="158.0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bba7a2" text-anchor="middle" >32 GB RAM</text><rect x="80.0" y="284" width="156" height="24" rx="12" fill="#fd5453"/><text x="158.0" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" >20 GB of the model</text><path d="M634.0,92 C634.0,128 480,130 480,164" stroke="#fc7a5c" stroke-width="2" stroke-dasharray="4 5" fill="none"/><rect x="362.0" y="170" width="236" height="150" rx="16" fill="#2a1f1d" stroke="#5b3d35" stroke-width="1.5"/><g transform="translate(460,192)"><rect x="5" y="2" width="30" height="21" rx="2" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 27h38l-3 4H4z" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f6ece9" text-anchor="middle" >Laptop</text><text x="480" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bba7a2" text-anchor="middle" >16 GB RAM</text><rect x="402" y="284" width="156" height="24" rx="12" fill="#fc7a5c"/><text x="480" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle" >14 GB of the model</text><path d="M854.0,92 C854.0,128 802.0,130 802.0,164" stroke="#fca07c" stroke-width="2" stroke-dasharray="4 5" fill="none"/><rect x="684.0" y="170" width="236" height="150" rx="16" fill="#2a1f1d" stroke="#5b3d35" stroke-width="1.5"/><g transform="translate(782.0,192)"><rect x="2" y="9" width="36" height="18" rx="5" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="18" r="1.6" fill="#f6ece9"/><path d="M17 18h14" stroke="#f6ece9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="802.0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#f6ece9" text-anchor="middle" >Mini PC</text><text x="802.0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bba7a2" text-anchor="middle" >8 GB RAM</text><rect x="724.0" y="284" width="156" height="24" rx="12" fill="#fca07c"/><text x="802.0" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5a2318" text-anchor="middle" >6 GB of the model</text><path d="M282.0,245.0 H354.0" stroke="#ff7f6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M604.0,245.0 H676.0" stroke="#ff7f6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M802.0,324 V348 Q802.0,362 788.0,362 H172.0 Q158.0,362 158.0,348 V330" stroke="#ff7f6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="392" y="348" width="176" height="28" rx="14" fill="#ff7f6a"/><text x="480" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle" >next word goes back</text><text x="480" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bba7a2" text-anchor="middle" >Each word makes one trip around the ring: every machine runs its share of the layers and passes the result on.</text></svg>
