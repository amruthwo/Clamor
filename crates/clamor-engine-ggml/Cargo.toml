[package]
name = "clamor-engine-ggml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ggml-based inference engine for Clamor pipeline stages"
build = "build.rs"

[features]
default = []
cuda = []
vulkan = []
metal = []
hip = []
opencl = []

[dependencies]
thiserror = "2"
anyhow = "1.0.104"
bytes = "1.12.1"
clamor-transport = { path = "../clamor-transport" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
cmake = "0.1"
