[package]
name = "clamor-engine-ggml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ggml-based inference engine for Clamor pipeline stages"
build = "build.rs"

[features]
default = []
cuda = []
vulkan = []
metal = []
hip = []
opencl = []

[dependencies]
thiserror = "2"
anyhow = "1.0.104"
bytes = "1.12.1"
clamor-transport = { path = "../clamor-transport" }
fancy-regex = "0.14"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
cmake = "0.1"
