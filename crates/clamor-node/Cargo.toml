[package]
name = "clamor-node"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clamor-engine-ggml = { path = "../clamor-engine-ggml" }
clamor-muster = { path = "../clamor-muster" }
clamor-proto = { path = "../clamor-proto" }
clamor-transport = { path = "../clamor-transport" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
bytes = "1.12.1"
dirs = "7.0.0"
getrandom = "0.3"
spake2 = "0.4.0"
tokio-stream = "0.1"
# Self-update (src/update.rs).
ed25519-dalek = "3.0.0"
flate2 = "1.1.11"
hex = "0.4.3"
self-replace = "1.5.1"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = "3.5.2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
mdns-sd = "0.21.7"

[features]
# GPU backends for pipeline stages (pick with --device).
cuda = ["clamor-engine-ggml/cuda"]
vulkan = ["clamor-engine-ggml/vulkan"]
metal = ["clamor-engine-ggml/metal"]
hip = ["clamor-engine-ggml/hip"]
opencl = ["clamor-engine-ggml/opencl"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
