[package]
name = "clamor-node"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clamor-muster = { version = "0.1.0", path = "../clamor-muster" }
clamor-proto = { version = "0.1.0", path = "../clamor-proto" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
